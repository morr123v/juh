name: Setup VNC on macOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  setup-vnc:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Homebrew packages (TigerVNC or similar)
        run: |
          brew update
          # TigerVNC හෝ අනෙකුත් VNC server එකක් ස්ථාපනය කිරීම
          brew install tigervnc
          echo "VNC Server installed successfully"

      - name: Configure and Start VNC Server
        run: |
          # VNC password සකස් කිරීම (උදාහරණයක් ලෙස)
          mkdir -p ~/.vnc
          echo "your_secure_password" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          # VNC Server ආරම්භ කිරීම
          # :1 යනු display number එකයි. Port 5901 වේ.
          vncserver :1 -geometry 1280x720 -depth 24 -localhost no
          
          echo "VNC Server started on port 5901"

      - name: Verify VNC is running
        run: |
          ps aux | grep vnc
          netstat -an | grep 5901

      - name: Optional - Expose via ngrok (for remote access)
        # මෙය අවශ්‍ය නම් පමණක් භාවිතා කරන්න. ngrok token එක GitHub Secrets හි තබන්න.
        if: ${{ secrets.NGROK_TOKEN != '' }}
        run: |
          brew install ngrok/ngrok/ngrok
          ngrok config add-authtoken ${{ secrets.NGROK_TOKEN }}
          ngrok tcp 5901 --log stdout &
          sleep 5
          echo "Ngrok URL available in logs"

      - name: Cleanup
        if: always()
        run: |
          vncserver -kill :1 || true
